<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kitchen Hub | Commercial Kitchen Equipment Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--steel:#2A3036;--steel2:#4A545D;--paper:#F2F3F1;--plate:#DDE1E3;--line:#C9CED2;--flame:#1F6BD6;--ink:#1B1F23;--mut:#5C666F}
*{box-sizing:border-box}
body{margin:0;background:#E4E7E8;color:var(--ink);font:400 15px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;margin:0;line-height:1.05}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--steel);color:#fff}
.bar b{font:700 22px "Barlow Condensed",sans-serif;margin-right:auto;letter-spacing:.02em}
.bar input,.bar select,.bar button{font:inherit;padding:7px 10px;border-radius:4px;border:1px solid var(--steel2);background:#fff;color:var(--ink)}
.bar button{background:var(--flame);border-color:var(--flame);color:#fff;cursor:pointer}
.bar input{width:180px}
:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
.stage{max-width:1100px;margin:18px auto;padding:0 12px}
.book{display:flex;justify-content:center;perspective:2400px}
.leaf{width:50%;height:clamp(540px,78vh,720px);background:var(--paper);overflow:hidden}
#L{border-radius:6px 0 0 6px;box-shadow:inset -14px 0 18px -14px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.18)}
#R{border-radius:0 6px 6px 0;box-shadow:inset 14px 0 18px -14px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.18)}
.leaf:empty{background:transparent;box-shadow:none}
.pg{position:relative;height:100%;padding:20px 20px 34px;display:flex;flex-direction:column}
.pn{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut)}
.cover,.cat{background:var(--steel);color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.cover h1{font-size:clamp(54px,8vw,92px);font-weight:700}
.cover p{margin:10px 0 0;color:#B9C1C7;max-width:28ch}
.cover .yr{margin-top:34px;border-top:2px solid var(--flame);padding-top:10px;color:#B9C1C7;font-size:13px}
.cat h2{font-size:clamp(44px,6vw,70px);font-weight:700}
.cat p{color:#B9C1C7;margin:8px 0 0}.cat ul{margin:22px 0 28px;padding:0;list-style:none;color:#B9C1C7;font-size:14px}.cat li{padding:5px 0;border-top:1px solid #3B434B}.sp{margin:0;padding:0;list-style:none;font-size:12px;color:var(--mut)}
.cover .pn,.cat .pn{color:#8A949C}
.pg>h2.t{font-size:34px;margin-bottom:14px}
.toc a{display:flex;gap:8px;padding:14px 0;font-size:19px;border-bottom:1px dotted var(--line);color:inherit;text-decoration:none;cursor:pointer}
.toc a span:first-child{flex:1}
.toc a:hover{color:var(--flame)}
.grid2{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.ph{flex:1;min-height:90px;background:linear-gradient(135deg,#E6E9EA,#CDD3D6);display:grid;place-items:center;color:var(--mut);font-size:12px;cursor:zoom-in;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:none}
.plate{align-self:flex-start;font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.06em;background:var(--plate);border:1px solid #AEB5BA;padding:1px 7px;border-radius:2px}
.card h3{font-size:20px;font-weight:600}
.card p{margin:0;font-size:13px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row b{font-size:14px;margin-right:auto}
.btn{font:600 13px Barlow,sans-serif;padding:6px 11px;border-radius:4px;text-decoration:none;border:1px solid var(--flame);background:var(--flame);color:#fff;cursor:pointer}
.btn.alt{background:#fff;color:var(--flame)}
.nav{display:flex;justify-content:center;align-items:center;gap:14px;margin:14px 0}
.nav button{font:600 15px Barlow,sans-serif;padding:8px 18px;border:1px solid var(--steel);background:#fff;border-radius:4px;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
#grid{display:none}
#grid h2{font-size:30px;margin:24px 0 10px}
#grid .gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.msg{padding:40px;text-align:center;color:var(--mut)}
dialog{border:0;border-radius:6px;padding:0;width:min(760px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(20,24,28,.7)}
.lb{padding:18px;display:grid;gap:12px}
.lb .main{aspect-ratio:4/3;background:#EEF0F1;display:grid;place-items:center}
.lb .main img{max-width:100%;max-height:100%}
.thumbs{display:flex;gap:8px}
.thumbs img{width:64px;height:48px;object-fit:cover;border:2px solid transparent;cursor:pointer;background:#EEF0F1}
.thumbs img.on{border-color:var(--flame)}
.lb dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.lb dt{color:var(--mut)}.lb dd{margin:0}
.x{justify-self:end}
.book{position:relative}
.turn{position:absolute;top:0;width:50%;height:100%;z-index:3;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.45,.05,.25,1);will-change:transform;pointer-events:none}
.turn.fw{left:50%;transform-origin:left center}.turn.bw{left:0;transform-origin:right center}
.turn .f,.turn .b{position:absolute;inset:0;overflow:hidden;background:var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.turn .b{transform:rotateY(180deg)}
.turn .f::after,.turn .b::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(0,0,0,.2),transparent 28%)}
.turn.bw .f::after{background:linear-gradient(to left,rgba(0,0,0,.2),transparent 28%)}
.fadeout{animation:fo .2s forwards}.fadein{animation:fi .25s}
@keyframes fo{to{opacity:0}}@keyframes fi{from{opacity:0}}
@media (max-width:899px){#L{display:none}.leaf{width:100%;overflow:auto;border-radius:6px!important}.pg{height:auto;min-height:100%}.grid2{grid-template-columns:1fr;grid-template-rows:none}.ph{flex:none;aspect-ratio:4/3}.bar input{width:100%;order:5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== v3: stage, tabs, dock, cover, cards, viewer ===== */
body{background:radial-gradient(1100px 560px at 50% -8%,#46515B,#1B2025 72%) fixed}
.stage{max-width:1240px}
.leaf{color:var(--ink)}
.bar{background:rgba(24,28,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid #3B434B}
#brand{font-size:27px}
#brand::before{content:"";display:inline-block;width:9px;height:22px;background:var(--flame);margin-right:10px;transform:skewX(-14deg);vertical-align:-3px}
.bar .ghost,.dock button{background:#2B3238;border:1px solid #4A545D;color:#fff;border-radius:4px;padding:7px 14px;cursor:pointer}
.bar .ghost:hover,.dock button:hover:not(:disabled){border-color:var(--flame)}
.dock button:disabled{opacity:.35;cursor:default}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
#tabs button{flex:none;display:flex;gap:8px;align-items:center;background:#2B3238;color:#D5DBDF;border:1px solid #444E57;border-radius:999px;padding:6px 14px;font:500 14px Barlow,sans-serif;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
#tabs button small{opacity:.65;font-size:12px}
#tabs button:hover{border-color:var(--acc);transform:translateY(-1px)}
#tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.shelf{display:flex;align-items:center;gap:12px}
.book{flex:1}
.arrow{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid #4A545D;background:#262C32;color:#fff;font-size:28px;line-height:1;cursor:pointer;transition:transform .2s,background .2s}
.arrow:hover:not(:disabled){background:var(--flame);transform:scale(1.1)}
.arrow:disabled{opacity:.25;cursor:default}
.dock{display:flex;align-items:center;gap:12px;max-width:820px;margin:18px auto 6px;color:#C9D1D6}
.dock input{flex:1;padding:0;accent-color:var(--flame);background:transparent;border:0}
.dock span{min-width:110px;text-align:center;font-size:13px}
.list .dock{display:none}
#grid>h2{color:#fff}#grid .msg{color:#B9C1C7}
#grid .card{overflow:visible;min-height:auto}#grid .ph{flex:none;aspect-ratio:4/3}
.cover{position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),linear-gradient(160deg,#323A42,#1A1F24)}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,72%) var(--my,22%),rgba(110,165,255,.26),transparent 62%);pointer-events:none}
.cover::after{content:"KH";position:absolute;top:-34px;right:-8px;font:700 270px/1 "Barlow Condensed",sans-serif;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.08);pointer-events:none}
.cover>*{position:relative;z-index:1}
.cat{border-left:12px solid var(--acc)}
.cat li{border-top-color:#3E464E}
.card{border-top:3px solid var(--acc,var(--line));transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(0,0,0,.2)}
.plate{border-color:var(--acc,#AEB5BA)}
.btn{background:var(--acc,var(--flame));border-color:var(--acc,var(--flame))}
.btn.alt{background:#fff;color:var(--acc,var(--flame))}
.ph{position:relative}
.ph img{transition:transform .4s}
.ph .alt2{position:absolute;inset:0;opacity:0;transition:opacity .35s}
.card:hover .alt2{opacity:1}
.card:hover .ph img:first-child{transform:scale(1.05)}
dialog[open]{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.lb .main{position:relative;display:block;overflow:hidden;cursor:zoom-in}
.lb .main:not(:has(img)){display:grid;place-items:center}
.lb .main img{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;transition:transform .25s}
.lb .main img.zoom{transform:scale(2.2);cursor:zoom-out}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(27,31,35,.72);color:#fff;font-size:24px;line-height:1;cursor:pointer;z-index:2}
.ar.l{left:10px}.ar.r{right:10px}
.ct{position:absolute;bottom:8px;right:10px;z-index:2;background:rgba(27,31,35,.72);color:#fff;font-size:12px;padding:2px 9px;border-radius:10px}
@media (max-width:899px){.arrow{display:none}#tabs{padding:10px 12px}.dock span{min-width:80px}}

/* ===== v3.1 fixes ===== */
.cover .pn{display:none}
.book{transition:transform .6s cubic-bezier(.45,.05,.25,1)}
.book.closed{transform:translateX(-25%)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.card .sp{display:none}
.card p{-webkit-line-clamp:2}
.card .row{flex-wrap:nowrap}
.card .row .btn{text-align:center;white-space:nowrap}
.card .row .btn:not(.alt){flex:1}
dialog{overflow:auto}
.lb .main{aspect-ratio:auto;height:min(46vh,62vw);width:100%}
.lb .plate{justify-self:start}
@media (max-width:899px){.book.closed{transform:none}}
@media (max-width:899px){.bar{padding:8px 12px;gap:8px}#brand{font-size:22px;flex:1 1 auto}.bar .ghost,#mode{padding:6px 10px;font-size:14px}.bar input{order:5;flex:1 0 100%}}

/* ===== v4: filters, enquiry list, sticky category nav, mobile ===== */
html,body{max-width:100%;overflow-x:clip}
#flt{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:1240px;margin:0 auto;padding:0 16px 8px;color:#C9D1D6;font-size:14px}
#flt select{padding:7px 10px;border-radius:4px;border:1px solid #4A545D;background:#2B3238;color:#fff;font:inherit}
#flt .chk{display:flex;gap:6px;align-items:center;cursor:pointer}
#flt .chk input{accent-color:var(--flame);width:16px;height:16px}
#flt .ghost{background:#2B3238;border:1px solid #4A545D;color:#fff;border-radius:4px;padding:6px 12px;cursor:pointer}
#fcnt{margin-left:auto;color:#9AA5AD}
.list #tabs{position:sticky;top:var(--bh,0px);z-index:4;background:#1E2328;border-bottom:1px solid #3B434B}
#grid h2{scroll-margin-top:calc(var(--bh,0px) + 64px)}
.btn.qb.on{background:var(--acc,var(--flame));color:#fff}
#qfab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:8px;align-items:center;background:var(--flame);color:#fff;border:0;border-radius:999px;padding:12px 18px;font:600 15px Barlow,sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.35);cursor:pointer}
#qfab[hidden]{display:none}
#qfab b{background:#fff;color:var(--flame);border-radius:999px;min-width:22px;padding:0 6px;text-align:center}
#qd .qh{display:flex;align-items:center;justify-content:space-between}
#qd h2{font-size:30px}
#qd label{font-weight:600;font-size:13px}
#qd input,#qd textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font:inherit}
#ql{max-height:40vh;overflow:auto}
.qi{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qi .muted{display:block;font-size:12px;color:var(--mut)}
.qty{display:flex;align-items:center;gap:6px}
.qty button,.rm{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:18px;line-height:1;cursor:pointer}
.rm{color:#B3261E}
.qty span{min-width:26px;text-align:center}
#qd .qa{flex-wrap:wrap}
#qd .qa .btn{flex:1 1 auto;text-align:center}
.btn.dis{opacity:.4;pointer-events:none}
@media (max-width:899px){
 .bar{position:static}
 .bar input,.bar select,#flt select,#qd input,#qd textarea{font-size:16px}
 .stage{margin:10px auto;padding:0 10px}
 .leaf{height:auto;min-height:60vh;overflow:visible}
 .pg{padding:16px 14px 34px}
 #flt{padding:0 12px 8px}#flt select{flex:1 1 130px}#fcnt{flex:1 0 100%;margin:0}
 .dock{flex-wrap:wrap;gap:8px;padding:0 10px;margin:12px auto}
 .dock input{order:5;flex:1 0 100%}
 #first{display:none}
 .dock span{flex:1;min-width:0}
 .dock button{padding:9px 14px}
 #grid .gg{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 #grid .card h3{font-size:17px}
 #grid .card .info{padding:8px 10px 10px}
 #grid .card .row{flex-wrap:wrap}
 #grid .card .row .btn{flex:1 1 100%;padding:9px 8px}
 dialog{max-width:100vw}.lb{padding:14px}
 .thumbs{overflow-x:auto}
}
@media (max-width:360px){#grid .gg{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="bar">
  <b id="brand">The Kitchen Hub</b>
  <button id="home" type="button" class="ghost">Contents</button>
  <input id="q" type="search" placeholder="Search products" aria-label="Search products">
  <button id="mode" type="button">List view</button>
</header>
<nav id="tabs" aria-label="Categories"></nav>
<section id="flt" aria-label="Filters"><select id="fp" aria-label="Power type" hidden></select><select id="fs" aria-label="Sort"><option value="">Sort: Default</option><option value="az">Name A to Z</option><option value="za">Name Z to A</option></select><label class="chk"><input type="checkbox" id="fph"> With photos</label><button type="button" id="fclr" class="ghost" hidden>Clear filters</button><span id="fcnt" aria-live="polite"></span></section>
<main class="stage">
  <div id="bookwrap">
    <div class="shelf">
      <button class="arrow" id="aL" aria-label="Previous page">&#8249;</button>
      <div class="book"><div class="leaf" id="L"></div><div class="leaf" id="R"></div></div>
      <button class="arrow" id="aR" aria-label="Next page">&#8250;</button>
    </div>
    <div class="dock"><button id="prev">Previous</button><button id="first" type="button">Cover</button><input type="range" id="sl" min="1" max="1" value="1" aria-label="Go to page"><span id="pos"></span><button id="next">Next</button></div>
  </div>
  <div id="grid"></div>
</main>
<button id="qfab" type="button" hidden>Enquiry list <b id="qn">0</b></button>
<dialog id="qd" aria-label="Enquiry list"></dialog>
<dialog id="lb"></dialog>

<script src="config.js"></script>
<script>

const DEMO={cats:[{id:"c1",name:"Cooking Equipment"},{id:"c2",name:"Refrigeration"},{id:"c3",name:"Food Preparation"}],
prods:[
{id:"1",category_id:"c1",name:"4-Burner Gas Range with Oven",model:"KH-GR4",description:"Heavy-duty stainless steel range with cast iron burners and a full-size oven. Built for busy hotel kitchens.",specs:[{l:"Burners",v:"4"},{l:"Power",v:"Gas"},{l:"Size",v:"900 x 800 x 900 mm"}],price:"Price on request",images:[]},
{id:"2",category_id:"c1",name:"Double Basket Deep Fryer",model:"KH-DF2",description:"Twin 12 L tanks with independent thermostats and a safety cut-off.",specs:[{l:"Capacity",v:"2 x 12 L"},{l:"Power",v:"Electric 6 kW"}],price:"Price on request",images:[]},
{id:"3",category_id:"c1",name:"Flat Top Griddle",model:"KH-GT6",description:"Polished steel plate with even heat distribution for breakfast and grill service.",specs:[{l:"Plate",v:"600 mm"}],price:"Price on request",images:[]},
{id:"4",category_id:"c1",name:"Combi Oven 6 Tray",model:"KH-CO6",description:"Steam, convection, and combination modes with a programmable touch panel.",specs:[{l:"Trays",v:"6 x GN 1/1"}],price:"Price on request",images:[]},
{id:"5",category_id:"c2",name:"Upright Chiller 2 Door",model:"KH-UC2",description:"Stainless steel body with digital control and auto-defrost.",specs:[{l:"Volume",v:"1200 L"},{l:"Temp",v:"0 to 8 C"}],price:"Price on request",images:[]},
{id:"6",category_id:"c2",name:"Under-counter Freezer",model:"KH-UF1",description:"Compact freezer that fits beneath a standard prep counter.",specs:[{l:"Volume",v:"300 L"}],price:"Price on request",images:[]},
{id:"7",category_id:"c3",name:"Planetary Mixer 20 L",model:"KH-PM20",description:"Three speeds with a stainless bowl, hook, whisk, and beater.",specs:[{l:"Bowl",v:"20 L"}],price:"Price on request",images:[]},
{id:"8",category_id:"c3",name:"Meat Slicer 300 mm",model:"KH-MS30",description:"Belt-driven slicer with an adjustable thickness gauge and blade guard.",specs:[{l:"Blade",v:"300 mm"}],price:"Price on request",images:[]}
]};

const $=s=>document.querySelector(s),L=$("#L"),R=$("#R");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
let DATA={cats:[],prods:[]},pages=[],cats=[],s=0,desk=innerWidth>=900,busy=false,list=[],listMode=false;

async function api(t,q){
  const r=await fetch(`${CFG.SUPABASE_URL}/rest/v1/${t}?${q}`,{headers:{apikey:CFG.SUPABASE_KEY,Authorization:"Bearer "+CFG.SUPABASE_KEY}});
  if(!r.ok)throw new Error(r.status);return r.json();
}
async function load(){
  if(!CFG.SUPABASE_URL){DATA=DEMO;return}
  try{DATA={cats:await api("categories","select=*&order=sort,name"),prods:await api("products","select=*&order=sort,name")}}
  catch(e){L.innerHTML="";R.innerHTML='<div class="msg">The catalogue could not be loaded. Please try again shortly.</div>';throw e}
}
const catOf=p=>DATA.cats.some(c=>c.id===p.category_id)?p.category_id:"_";
const wa=p=>`https://wa.me/${CFG.WHATSAPP}?text=${encodeURIComponent("Hi, I'd like to enquire about: "+p.name+(p.model?" ("+p.model+")":""))}`;
const mail=p=>`mailto:${CFG.EMAIL}?subject=${encodeURIComponent("Enquiry: "+p.name)}&body=${encodeURIComponent("Hi, please send details and a quote for: "+p.name+(p.model?" ("+p.model+")":""))}`;

const F={pw:"",sort:"",ph:false};
const catNm=p=>(DATA.cats.find(c=>c.id===p.category_id)||{name:"More equipment"}).name;
const txt=p=>[p.name,p.model,p.description,catNm(p),(p.specs||[]).map(x=>x.l+" "+x.v).join(" ")].join(" ").toLowerCase();
const pw=p=>{const t=txt(p);return /\bgas\b|\blpg\b/.test(t)?"gas":/electric/.test(t)?"electric":""};
function build(q=""){
  const w=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  list=DATA.prods.filter(p=>{const t=txt(p);return w.every(x=>t.includes(x))&&(!F.pw||pw(p)===F.pw)&&(!F.ph||(p.images&&p.images.length))});
  if(F.sort)list.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})*(F.sort==="za"?-1:1));
  cats=DATA.cats.slice();
  if(list.some(p=>catOf(p)==="_"))cats.push({id:"_",name:"More equipment"});
  pages=[{k:"cover"},{k:"toc"}];
  cats.forEach((c,ci)=>{const it=list.filter(p=>catOf(p)===c.id);if(!it.length)return;
    pages.push({k:"cat",c,ci,n:it.length,names:it.slice(0,8).map(p=>p.name)});
    for(let i=0;i<it.length;i+=CFG.PER_PAGE)pages.push({k:"prods",ci,it:it.slice(i,i+CFG.PER_PAGE)})});
  pages.push({k:"back"});
  $("#tabs").innerHTML=pages.map(p=>p.k==="cat"?`<button type="button" data-go="${pages.indexOf(p)}" data-ci="${p.ci}" style="--acc:${ACC[p.ci%ACC.length]}">${esc(p.c.name)}<small>${p.n}</small></button>`:"").join("");
}
const card=p=>`<article class="card"><div class="ph" data-open="${esc(p.id)}" tabindex="0" role="button" aria-label="View ${esc(p.name)}">${p.images&&p.images[0]?`<img loading="lazy" src="${esc(p.images[0])}" alt="${esc(p.name)}">${p.images[1]?`<img class="alt2" loading="lazy" src="${esc(p.images[1])}" alt="">`:""}`:"No photo yet"}</div>
<div class="info">${p.model?`<span class="plate">${esc(p.model)}</span>`:""}<h3>${esc(p.name)}</h3><p>${esc(p.description)}</p>${(p.specs||[]).length?`<ul class="sp">${p.specs.slice(0,3).map(x=>`<li>${esc(x.l)}: ${esc(x.v)}</li>`).join("")}</ul>`:""}
<div class="row">${price(p)}<a class="btn" href="${wa(p)}" target="_blank" rel="noopener">Enquire</a>${qbtn(p.id)}</div></div></article>`;

function pg(i){
  const p=pages[i];if(!p)return"";let h="";
  if(p.k==="cover")h=`<h1>${esc(CFG.COMPANY)}</h1><p>${esc(CFG.TAGLINE)}</p><div class="yr">Commercial kitchen equipment catalogue, ${new Date().getFullYear()}</div>`;
  else if(p.k==="toc")h=`<h2 class="t">Contents</h2><nav class="toc">${pages.map((x,j)=>x.k==="cat"?`<a data-go="${j}" tabindex="0"><span>${esc(x.c.name)}</span><span>${j+1}</span></a>`:"").join("")||'<div class="msg">No products match your search.</div>'}</nav>`;
  else if(p.k==="cat")h=`<h2>${esc(p.c.name)}</h2><p>${p.n} product${p.n>1?"s":""}</p><ul>${p.names.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`;
  else if(p.k==="prods")h=`<div class="grid2">${p.it.map(card).join("")}</div>`;
  else h=`<h2 class="t">Talk to us</h2><p>Tell us what you are building and we will help you choose the right equipment, plan the layout, and arrange delivery.</p><p><a class="btn" href="https://wa.me/${CFG.WHATSAPP}" target="_blank" rel="noopener">WhatsApp us</a> <a class="btn alt" href="mailto:${CFG.EMAIL}">${esc(CFG.EMAIL)}</a></p>`;
  return `<section class="pg ${p.k}" style="--acc:${ACC[(p.ci||0)%ACC.length]}">${h}<span class="pn">${i+1}</span></section>`;
}
const nS=()=>desk?1+Math.ceil((pages.length-1)/2):pages.length;
const spreadOf=i=>desk?(i===0?0:Math.ceil(i/2)):i;
const pagesOf=n=>desk?(n===0?[null,0]:[2*n-1,2*n<pages.length?2*n:null]):[null,n];
function show(){
  const [a,b]=pagesOf(s);
  L.innerHTML=a==null?"":pg(a);R.innerHTML=b==null?"":pg(b);L.scrollTop=R.scrollTop=0;document.querySelector(".book").classList.toggle("closed",desk&&s===0);
  const v=[a,b].filter(x=>x!=null).map(x=>x+1);
  $("#pos").textContent=`Page ${v.join("–")} of ${pages.length}`;
  $("#prev").disabled=$("#aL").disabled=s===0;$("#next").disabled=$("#aR").disabled=s>=nS()-1;sync(v);
}
function go(n){
  n=Math.max(0,Math.min(nS()-1,n));if(n===s||busy)return;
  if(reduce){s=n;show();return}
  if(!desk){busy=true;R.classList.add("fadeout");
    setTimeout(()=>{R.classList.remove("fadeout");s=n;show();R.classList.add("fadein");setTimeout(()=>{R.classList.remove("fadein");busy=false},260)},200);return}
  const d=n>s?1:-1,o=pagesOf(s),w=pagesOf(n),bk=document.querySelector(".book"),t=document.createElement("div");
  bk.classList.toggle("closed",n===0);
  const front=d>0?o[1]:o[0],back=d>0?w[0]:w[1];
  t.className="turn "+(d>0?"fw":"bw");
  t.innerHTML=`<div class="f">${front==null?"":pg(front)}</div><div class="b">${back==null?"":pg(back)}</div>`;
  if(d>0)R.innerHTML=w[1]==null?"":pg(w[1]);else L.innerHTML=w[0]==null?"":pg(w[0]);
  busy=true;bk.appendChild(t);void t.offsetWidth;
  let done=false;const end=()=>{if(done)return;done=true;t.remove();s=n;show();busy=false};
  t.addEventListener("transitionend",end,{once:true});setTimeout(end,1100);
  t.style.transform=`rotateY(${d>0?-180:180}deg)`;
}
function renderList(){
  $("#grid").innerHTML=cats.map((c,i)=>{const it=list.filter(p=>catOf(p)===c.id);return it.length?`<h2 id="cs${i}">${esc(c.name)}</h2><div class="gg">${it.map(card).join("")}</div>`:""}).join("")||'<div class="msg">No products match your search or filters.</div>';
  $("#fcnt").textContent=`${list.length} of ${DATA.prods.length} products`;
  $("#fclr").hidden=!(F.pw||F.sort||F.ph||$("#q").value.trim());
}
function open(id){
  const p=DATA.prods.find(x=>x.id===id);if(!p)return;
  const im=p.images||[];lbU=im;lbI=0;
  $("#lb").innerHTML=`<div class="lb"><button class="btn alt x" id="cl">Close</button>
  <div class="main">${im[0]?`<img id="big" src="${esc(im[0])}" alt="${esc(p.name)}">${im.length>1?'<button type="button" class="ar l" data-lb="-1" aria-label="Previous photo">&#8249;</button><button type="button" class="ar r" data-lb="1" aria-label="Next photo">&#8250;</button>':""}<span class="ct" id="ct">1 / ${im.length}</span>`:"No photo yet"}</div>
  ${im.length>1?`<div class="thumbs">${im.map((u,i)=>`<img src="${esc(u)}" class="${i?"":"on"}" alt="Photo ${i+1}">`).join("")}</div>`:""}
  ${p.model?`<span class="plate">${esc(p.model)}</span>`:""}<h2>${esc(p.name)}</h2><p>${esc(p.description)}</p>
  <dl>${(p.specs||[]).map(x=>`<dt>${esc(x.l)}</dt><dd>${esc(x.v)}</dd>`).join("")}</dl>
  <div class="row">${price(p)}${qbtn(p.id)}<a class="btn" href="${wa(p)}" target="_blank" rel="noopener">Enquire on WhatsApp</a><a class="btn alt" href="${mail(p)}">Email</a></div></div>`;
  $("#lb").showModal();
}
document.addEventListener("click",e=>{
  const t=e.target,qb=t.closest("[data-q]");if(qb)return qtoggle(qb.dataset.q);
  if(t.closest("#qfab"))return qopen();
  if(t.dataset.qp!=null){const x=Q[+t.dataset.qp];x.n=Math.min(999,x.n+1);qsave();return qlist()}
  if(t.dataset.qm!=null){const x=Q[+t.dataset.qm];x.n=Math.max(1,x.n-1);qsave();return qlist()}
  if(t.dataset.qx!=null){Q.splice(+t.dataset.qx,1);qsave();return qrefresh()}
  if(t.id==="qc")return $("#qd").close();
  if(t.id==="qclr"){if(Q.length&&confirm("Clear the whole list?")){Q=[];qsave();qrefresh()}return}
  const o=t.closest("[data-open]");if(o)return open(o.dataset.open);
  const g=t.closest("[data-go]");if(g){
    if(listMode&&g.closest("#tabs")){const h=$("#cs"+g.dataset.ci);if(h)h.scrollIntoView({behavior:reduce?"auto":"smooth"});return}
    return go(spreadOf(+g.dataset.go))}
  if(e.target.id==="cl")$("#lb").close();
  if(e.target.matches(".thumbs img"))lbSet([...e.target.parentNode.children].indexOf(e.target));
  if(e.target.dataset.lb)lbSet(lbI+ +e.target.dataset.lb);
  if(e.target.id==="big")e.target.classList.toggle("zoom");
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-open],[data-go]")){e.preventDefault();e.target.click();return}
  if(e.target.matches("input,select")||$("#lb").open)return;
  if(e.key==="ArrowRight")go(s+1);if(e.key==="ArrowLeft")go(s-1)});
$("#next").onclick=()=>go(s+1);$("#prev").onclick=()=>go(s-1);

let tx=0;$("#bookwrap").addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
$("#bookwrap").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)go(s+(dx<0?1:-1))});
let t;$("#q").oninput=e=>{clearTimeout(t);t=setTimeout(()=>{build(e.target.value);s=spreadOf(e.target.value.trim()&&pages.length>3?2:0);show();renderList()},200)};
$("#mode").onclick=()=>{listMode=!listMode;$("#bookwrap").style.display=listMode?"none":"";$("#grid").style.display=listMode?"block":"none";$("#mode").textContent=listMode?"Flipbook view":"List view"};
addEventListener("resize",()=>{const d=innerWidth>=900;if(d!==desk){const cur=pagesOf(s).find(x=>x!=null)??0;desk=d;s=spreadOf(cur);show()}});

/* ---- navigation, category colours, photo viewer ---- */
const ACC=["#1F6BD6","#B8620F","#13806F","#B03A34","#6B4DB8","#2F7A33","#A23F70","#1D6A94","#946F0F","#4A5660","#7A4B2C","#3F6E8C"];
let lbI=0,lbU=[];
const price=p=>p.price&&!/on request/i.test(p.price)?`<b>${esc(p.price)}</b>`:"";
function sync(v){
  const cur=v[0]-1,sl=$("#sl");sl.max=pages.length;sl.value=cur+1;
  let ci=-1;if(pages[cur]&&pages[cur].k!=="back")for(let i=cur;i>=0;i--)if(pages[i].ci!=null){ci=pages[i].ci;break}
  document.querySelectorAll("#tabs button").forEach(b=>{const on=+b.dataset.ci===ci;b.classList.toggle("on",on);if(on)b.scrollIntoView({inline:"center",block:"nearest",behavior:reduce?"auto":"smooth"})});
  try{if(!$("#q").value.trim())history.replaceState(null,"","#page="+(cur+1))}catch(e){}
}
function hashSpread(){const m=/page=(\d+)/.exec(location.hash);return m?spreadOf(Math.max(0,Math.min(pages.length-1,+m[1]-1))):0}
function lbSet(i){
  if(lbU.length<2)return;lbI=(i+lbU.length)%lbU.length;
  const b=$("#big");b.classList.remove("zoom");b.style.transformOrigin="";b.src=lbU[lbI];$("#ct").textContent=`${lbI+1} / ${lbU.length}`;
  document.querySelectorAll(".thumbs img").forEach((t,k)=>t.classList.toggle("on",k===lbI));
}
$("#aL").onclick=()=>go(s-1);$("#aR").onclick=()=>go(s+1);$("#first").onclick=()=>go(0);
$("#home").onclick=()=>{if(listMode)$("#mode").click();go(spreadOf(1))};
$("#sl").oninput=e=>{$("#pos").textContent=`Page ${e.target.value} of ${pages.length}`};
$("#sl").onchange=e=>{const n=spreadOf(+e.target.value-1);n===s?show():go(n)};
$("#mode").addEventListener("click",()=>document.body.classList.toggle("list",listMode));
addEventListener("hashchange",()=>{const n=hashSpread();if(n!==s)go(n)});
document.addEventListener("keydown",e=>{if(e.target.matches("input,select")||$("#lb").open)return;if(e.key==="Home")go(0);if(e.key==="End")go(nS()-1)});
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".cover");if(c){const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")}});
$("#lb").addEventListener("keydown",e=>{if(e.key==="ArrowRight")lbSet(lbI+1);if(e.key==="ArrowLeft")lbSet(lbI-1)});
$("#lb").addEventListener("mousemove",e=>{const b=e.target;if(b.id==="big"&&b.classList.contains("zoom")){const r=b.parentNode.getBoundingClientRect();b.style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`}});
let lx=0;$("#lb").addEventListener("touchstart",e=>lx=e.touches[0].clientX,{passive:true});
$("#lb").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-lx;if(Math.abs(dx)>50&&lbU.length>1)lbSet(lbI+(dx<0?1:-1))});

/* ---- enquiry list ---- */
let Q=[];try{Q=JSON.parse(localStorage.getItem("khq")||"[]").filter(x=>x&&x.id)}catch(e){}
const qsave=()=>{try{localStorage.setItem("khq",JSON.stringify(Q))}catch(e){}};
const inQ=id=>Q.some(x=>x.id===id);
const qbtn=id=>`<button type="button" class="btn alt qb${inQ(id)?" on":""}" data-q="${esc(id)}" aria-pressed="${inQ(id)}">${inQ(id)?"In list":"Add to list"}</button>`;
function qtoggle(id){
  if(inQ(id))Q=Q.filter(x=>x.id!==id);
  else{const p=DATA.prods.find(x=>x.id===id);if(!p)return;Q.push({id,name:p.name,model:p.model||"",n:1})}
  qsave();qrefresh();
}
function qrefresh(){
  $("#qfab").hidden=!Q.length;$("#qn").textContent=Q.length;
  document.querySelectorAll("[data-q]").forEach(b=>{const on=inQ(b.dataset.q);b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);b.textContent=on?"In list":"Add to list"});
  qlist();
}
function qmsg(){
  const nm=($("#qnm")||{}).value||"",nt=($("#qnt")||{}).value||"";
  return "Hi, I'd like a quote for these items:\n"+Q.map((x,i)=>`${i+1}. ${x.name}${x.model?" ("+x.model+")":""} x ${x.n}`).join("\n")+(nt.trim()?"\n\nNotes: "+nt.trim():"")+(nm.trim()?"\n\nFrom: "+nm.trim():"")+"\n\nThank you.";
}
function qlinks(){
  const w=$("#qwa"),e=$("#qem");if(!w)return;const t=qmsg();
  w.href=`https://wa.me/${CFG.WHATSAPP}?text=${encodeURIComponent(t)}`;
  e.href=`mailto:${CFG.EMAIL}?subject=${encodeURIComponent("Quote request: "+Q.length+" item"+(Q.length==1?"":"s"))}&body=${encodeURIComponent(t)}`;
  w.classList.toggle("dis",!Q.length);e.classList.toggle("dis",!Q.length);
}
function qlist(){
  const l=$("#ql");if(!l)return;
  l.innerHTML=Q.length?Q.map((x,i)=>`<div class="qi"><div><b>${esc(x.name)}</b>${x.model?`<span class="muted">${esc(x.model)}</span>`:""}</div><div class="qty"><button type="button" data-qm="${i}" aria-label="Fewer ${esc(x.name)}">-</button><span>${x.n}</span><button type="button" data-qp="${i}" aria-label="More ${esc(x.name)}">+</button></div><button type="button" class="rm" data-qx="${i}" aria-label="Remove ${esc(x.name)}">&times;</button></div>`).join(""):'<p class="msg">Your list is empty. Tap "Add to list" on any product.</p>';
  qlinks();
}
function qopen(){
  $("#qd").innerHTML=`<div class="lb"><div class="qh"><h2>Enquiry list</h2><button class="btn alt" id="qc" type="button">Close</button></div><div id="ql"></div><div><label for="qnm">Your name or company (optional)</label><input id="qnm" autocomplete="organization"></div><div><label for="qnt">Notes (optional)</label><textarea id="qnt" rows="2" placeholder="Delivery location, timing, questions"></textarea></div><div class="row qa"><button class="btn alt" id="qclr" type="button">Clear list</button><a class="btn" id="qwa" target="_blank" rel="noopener">Send on WhatsApp</a><a class="btn alt" id="qem">Send by email</a></div></div>`;
  qlist();$("#qd").showModal();
}
$("#qd").addEventListener("input",qlinks);

/* ---- filters ---- */
function fopts(){
  const c={gas:0,electric:0};DATA.prods.forEach(p=>{const k=pw(p);if(k)c[k]++});
  $("#fp").hidden=!(c.gas||c.electric);
  $("#fp").innerHTML=`<option value="">Power: Any</option><option value="gas">Gas (${c.gas})</option><option value="electric">Electric (${c.electric})</option>`;
}
function applyF(){build($("#q").value);s=0;show();renderList()}
$("#fp").onchange=e=>{F.pw=e.target.value;applyF()};
$("#fs").onchange=e=>{F.sort=e.target.value;applyF()};
$("#fph").onchange=e=>{F.ph=e.target.checked;applyF()};
$("#fclr").onclick=()=>{F.pw=F.sort="";F.ph=false;$("#fp").value=$("#fs").value="";$("#fph").checked=false;$("#q").value="";applyF()};

/* ---- sticky offset + category highlight in list view ---- */
const setBH=()=>{const b=document.querySelector(".bar");document.documentElement.style.setProperty("--bh",(getComputedStyle(b).position==="sticky"?b.offsetHeight:0)+"px")};
addEventListener("resize",setBH);document.fonts&&document.fonts.ready.then(setBH);
let lastA=-2;
addEventListener("scroll",()=>{
  if(!listMode)return;
  const y=(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bh"))||0)+90;let a=-1;
  document.querySelectorAll("#grid h2").forEach(h=>{if(h.getBoundingClientRect().top<y)a=+h.id.slice(2)});
  if(a===lastA)return;lastA=a;const tb=$("#tabs");
  document.querySelectorAll("#tabs button").forEach(b=>{const on=+b.dataset.ci===a;b.classList.toggle("on",on);if(on)tb.scrollLeft=b.offsetLeft-tb.clientWidth/2+b.offsetWidth/2});
},{passive:true});

(async()=>{
  document.title=`${CFG.COMPANY} | Commercial Kitchen Equipment Catalogue`;$("#brand").textContent=CFG.COMPANY;
  const hadHash=(+(/page=(\d+)/.exec(location.hash)||[])[1]||0)>1;
  await load();fopts();build();s=hashSpread();show();renderList();qrefresh();setBH();
  if(!desk&&!hadHash)$("#mode").click();
})();
</script>
</body>
</html>
