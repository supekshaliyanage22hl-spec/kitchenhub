name: Update catalogue pages

# Rebuilds products.html, sitemap.xml and robots.txt from your Supabase products.
# Runs every night, and whenever you press "Run workflow" (Actions tab) after editing products.
on:
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC = 02:00 Sri Lanka time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-catalogue.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.html sitemap.xml robots.txt
          git diff --cached --quiet || (git commit -m "Update catalogue pages" && git push)
